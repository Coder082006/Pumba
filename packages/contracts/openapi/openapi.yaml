        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFlightsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetFlightsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetFlightsRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/items:
    post:
      operationId: trips_items_create
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/items/{item_id}:
    patch:
      operationId: trips_items_partial_update
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    delete:
      operationId: trips_items_destroy
      description: |-
        Returns the trip rather than 204.

        §24.14 re-renders the timeline after a removal — sequence numbers and
        the running total both change — so a 204 would be immediately followed
        by a GET. A locked item is a 409 (§10.8), raised by the service.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/itinerary/generate:
    post:
      operationId: trips_itinerary_generate_create
      description: |-
        §10.2's generate. The findings come back on the itinerary, not as
        an error: §10.6 returns them from a run that worked.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/quote:
    post:
      operationId: trips_quote_create
      description: |-
        Converts a plan into a priced, inventory-backed, time-boxed offer — SRS §9.4.5.

        Every activity on the itinerary is resolved to the departure its start instant names, and capacity for the whole party is held against each **under a row lock** (§17.3). The figures returned here are authoritative in a way the ones from `GET /activities/{id}/departures` are not: those may be stale, these were true at the moment the lock was held.

        The hold lasts `quote.ttl_minutes` — twenty by default — and is released automatically when it expires, at which point the trip returns to `DRAFT` and can be edited again.

        A re-quote **releases this trip's own prior holds first**, so asking twice does not make a trip compete with itself for the last seats.

        **409 `INVENTORY_UNAVAILABLE`** carries a `details` array naming every departure that could not be held, why, and any alternative departures of the same activity. **409 `TRIP_NOT_QUOTABLE`** means the itinerary has not been planned, has blocking validation errors, or is in a state past pricing.

        **`Idempotency-Key` is required.** Retrying with the same key replays the first answer rather than holding a second set of seats; a second request arriving while the first is still running is `409 IDEMPOTENT_REQUEST_IN_PROGRESS` and is safe to retry.
      summary: Price a trip and hold its capacity
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: A client-generated key, at most 64 characters, unique to this
          attempt. Repeating a request with the same key returns the first response
          and takes no further capacity; reusing one for a different trip is `409
          IDEMPOTENCY_KEY_REUSED`. Kept for `idempotency.retention_hours`. A failed
          attempt releases its key, so a retry after `409 INVENTORY_UNAVAILABLE` may
          reuse it.
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trip
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
  /api/v1/webhooks/psp/{provider}:
    post:
      operationId: webhooks_psp_create
      description: Signature-verified and idempotent. A duplicate event id is acknowledged
        without reprocessing (TC-071); an event that would not advance the payment
        is recorded and ignored (§21.5).
      summary: Payment provider callback
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - payment
      security:
      - {}
      responses:
        '200':
          description: No response body
