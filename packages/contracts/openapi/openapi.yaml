      operationId: tags_list
      description: 'The §24.7 category chips. Rows, not code: adding an interest is
        an administrator action and reaches the chip strip with no deployment, and
        retiring one removes it the same way.'
      summary: List the interest vocabulary
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
  /api/v1/trips:
    get:
      operationId: trips_list
      description: §24.20's My Trips — summaries, not full trips.
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
          description: ''
    post:
      operationId: trips_create
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}:
    get:
      operationId: trips_retrieve
      description: |-
        A trip that is not this tourist's is absent, not forbidden (§30.3).

        `services.get_trip` returns `None` for both a foreign trip and one that
        never existed, and this raises the same error for both — so the two are
        indistinguishable from outside, which is the point.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    patch:
      operationId: trips_partial_update
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTripRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTripRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTripRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/cancel:
    post:
      operationId: trips_cancel_create
      description: |-
        §20.5. A completed trip is a 409, raised by the state machine —
        a journey that has happened cannot be made not to have happened.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/flights:
    put:
      operationId: trips_flights_update
      description: '§9.4.2 is a PUT: the whole set replaces what is there.'
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFlightsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetFlightsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetFlightsRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/items:
    post:
      operationId: trips_items_create
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/items/{item_id}:
    patch:
      operationId: trips_items_partial_update
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateItemRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    delete:
      operationId: trips_items_destroy
      description: |-
        Returns the trip rather than 204.

        §24.14 re-renders the timeline after a removal — sequence numbers and
        the running total both change — so a 204 would be immediately followed
        by a GET. A locked item is a 409 (§10.8), raised by the service.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}/itinerary/generate:
    post:
      operationId: trips_itinerary_generate_create
      description: |-
        §10.2's generate. The findings come back on the itinerary, not as
        an error: §10.6 returns them from a run that worked.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
components:
  schemas:
    Accommodation:
      type: object
      description: |-
        §7.5.7 and §14 as amended — ADR 0013.

        A location record. There is no rate field to suppress, which is the
        difference between deferring a subsystem and hiding one.
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        summary:
          type:
          - string
          - 'null'
        description:
          type: string
        property_type:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        address_line:
          type: string
        check_in_time:
          type:
          - string
          - 'null'
          format: time
        check_out_time:
          type:
          - string
          - 'null'
          format: time
        feature_rank:
          type: integer
        destination:
          $ref: '#/components/schemas/Destination'
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      required:
      - address_line
      - check_in_time
      - check_out_time
      - description
      - destination
      - feature_rank
      - latitude
      - longitude
      - media
      - name
      - property_type
      - public_id
      - slug
      - summary
    AccommodationWriteRequest:
      type: object
      description: |-
        §7.5.7 as amended — ADR 0013.

        There is no rate, no room type, no cancellation policy and no provider to
        send. The field list is the enforcement: a client that posts `base_rate`
        gets a 422 naming it, rather than a 200 that quietly dropped a price.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        destination:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 140
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        summary:
          type:
          - string
          - 'null'
          minLength: 1
        description:
          type: string
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        address_line:
          type: string
          maxLength: 255
        check_in_time:
          type:
          - string
          - 'null'
          format: time
        check_out_time:
          type:
          - string
          - 'null'
          format: time
        feature_rank:
          type: integer
          minimum: 1
        is_active:
          type: boolean
      required:
      - destination
      - latitude
      - longitude
      - name
      - property_type
      - slug
    Activity:
      type: object
      description: |-
        §16.1.

        No converted price appears here. §18.4 puts conversion at quote time, and
        a display conversion is an `IndicativeAmount` applied over this — which is
        a different thing with a different label and a different half-life.
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        summary:
          type:
          - string
          - 'null'
        description:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        meeting_point:
          type: string
        duration_minutes:
          type: integer
        price_per_person:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        price_per_group:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        currency:
          type: string
        min_pax:
          type: integer
        max_pax:
          type: integer
        min_age:
          type:
          - integer
          - 'null'
        requirements: {}
        inclusions: {}
        exclusions: {}
        booking_cutoff_hours:
          type: integer
        confirmation_mode:
          type: string
        tags:
          type: array
          items:
            type: string
        rating_avg:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        rating_count:
          type: integer
        feature_rank:
          type: integer
        destination:
          $ref: '#/components/schemas/Destination'
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      required:
      - booking_cutoff_hours
      - confirmation_mode
      - currency
      - description
      - destination
      - duration_minutes
      - exclusions
      - feature_rank
      - inclusions
      - latitude
      - longitude
      - max_pax
      - media
      - meeting_point
      - min_age
      - min_pax
      - name
      - price_per_group
      - price_per_person
      - public_id
      - rating_avg
      - rating_count
      - requirements
      - slug
      - summary
      - tags
    ActivityWriteRequest:
      type: object
      description: |-
        §16.1. Administrator-created until the Phase 11 provider portal.

        `price_per_person` and `currency` are both required on create and are
        checked against each other by the model's CHECK constraint. §7.2 does not
        allow an amount without a currency anywhere, and an activity is where that
        would first cost somebody money.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        destination:
          type: string
          format: uuid
        attraction:
          type:
          - string
          - 'null'
          format: uuid
        cancellation_policy:
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 140
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        summary:
          type:
          - string
          - 'null'
          minLength: 1
        description:
          type: string
        meeting_point_text:
          type: string
          maxLength: 255
        duration_minutes:
          type: integer
          minimum: 1
        price_per_person:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        price_per_group:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        currency:
          type: string
          minLength: 3
          maxLength: 3
        min_pax:
          type: integer
          minimum: 1
        max_pax:
          type: integer
          minimum: 1
        min_age:
          type:
          - integer
          - 'null'
          minimum: 0
        requirements: {}
        inclusions: {}
        exclusions: {}
        booking_cutoff_hours:
          type: integer
          minimum: 0
        confirmation_mode:
          $ref: '#/components/schemas/ConfirmationModeEnum'
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[-a-zA-Z0-9_]+$
        feature_rank:
          type: integer
          minimum: 1
        is_active:
          type: boolean
      required:
      - currency
      - destination
      - duration_minutes
      - latitude
      - longitude
      - max_pax
      - name
      - price_per_person
      - slug
    AddItemRequest:
      type: object
      description: |-
        `POST /trips/{id}/items`.

        `item_type` is not constrained to `ADDABLE_ITEM_TYPES` here. The service
        owns that rule — TRANSFER is excluded because §10.4 inserts transfers — and
        duplicating the set would give two places to add a type to.

        **The listing is named, not numbered.** These three fields took the
        catalogue row's integer primary key when the endpoint was first written,
        which made it uncallable: §7.2 forbids returning sequential integers to
        clients, so the catalogue API exposes `public_id` and `slug` and the
        integer a caller would have had to send does not exist outside the
        database. A slug or UUID is what a client actually holds — it is in the
        address bar of the page the tourist is adding from — and it is resolved by
        `catalogue.resolve_listing_ref` exactly as a flight's gateway is.

        **`title` is optional and normally omitted.** The service titles the item
        from the resolved listing's own name, so two tourists adding the same
        activity get the same words. It is accepted for FREE_TIME, which names
        nothing and so has no name to borrow.
      properties:
        item_type:
          type: string
          minLength: 1
        day_number:
          type: integer
          minimum: 1
        sequence_no:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 160
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        accommodation:
          type:
          - string
          - 'null'
          minLength: 1
        activity:
          type:
          - string
          - 'null'
          minLength: 1
        attraction:
          type:
          - string
          - 'null'
          minLength: 1
      required:
      - day_number
      - ends_at
      - item_type
      - sequence_no
      - starts_at
    Attraction:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        summary:
          type:
          - string
          - 'null'
        description:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        opening_hours:
          oneOf:
          - {}
          - type: 'null'
        entrance_fee:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        fee_currency:
          type:
          - string
          - 'null'
        visit_minutes:
          type:
          - integer
          - 'null'
        tags:
          type: array
          items:
            type: string
        accessibility_notes:
          type: string
        feature_rank:
          type: integer
        destination:
          $ref: '#/components/schemas/Destination'
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
      required:
      - accessibility_notes
      - description
      - destination
      - entrance_fee
      - feature_rank
      - fee_currency
      - latitude
      - longitude
      - media
      - name
      - opening_hours
      - public_id
      - slug
      - summary
      - tags
      - visit_minutes
    AttractionWriteRequest:
      type: object
      description: §15.1.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        destination:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 140
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        summary:
          type:
          - string
          - 'null'
          minLength: 1
        description:
          type: string
        opening_hours:
          oneOf:
          - {}
          - type: 'null'
        entrance_fee:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        fee_currency:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 3
        visit_minutes:
          type:
          - integer
          - 'null'
          minimum: 1
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[-a-zA-Z0-9_]+$
        accessibility_notes:
          type: string
        feature_rank:
          type: integer
          minimum: 1
        is_active:
          type: boolean
      required:
      - destination
      - latitude
      - longitude
      - name
      - slug
    CancellationPolicy:
      type: object
      description: '§14.6. `tiers` travels whole: a tourist needs the ladder, not
        the code.'
      properties:
        public_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/CancellationPolicyTier'
      required:
      - code
      - description
      - name
      - public_id
      - tiers
    CancellationPolicyTier:
      type: object
      description: |-
        One rung of the §14.6 ladder.

        Bounded here as well as by `domain.cancellation.parse_tiers`, because the
        domain rejects rather than repairs and an administrator who typed 150 in a
        percent field deserves to be told which field, not handed a refusal about
        the whole list.
      properties:
        hours_before:
          type: integer
          minimum: 0
        refund_percent:
          type: integer
          maximum: 100
          minimum: 0
      required:
      - hours_before
      - refund_percent
    CancellationPolicyTierRequest:
      type: object
      description: |-
        One rung of the §14.6 ladder.

        Bounded here as well as by `domain.cancellation.parse_tiers`, because the
        domain rejects rather than repairs and an administrator who typed 150 in a
        percent field deserves to be told which field, not handed a refusal about
        the whole list.
      properties:
        hours_before:
          type: integer
          minimum: 0
        refund_percent:
          type: integer
          maximum: 100
          minimum: 0
      required:
      - hours_before
      - refund_percent
    CancellationPolicyWriteRequest:
      type: object
      description: |-
        §14.6. Four policies ship as rows; a fifth is a console form.

        `tiers` is ordered most generous first and is validated by
        `domain.cancellation.parse_tiers` at the model tier, which is the one that
        also runs for the seed loader. What this adds is a per-field message.

        BR-106 is why editing this is safe: a booking snapshots the policy in force
        at confirmation, so a change here alters what future bookings are offered
        and never what past ones were sold.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/CancellationPolicyTierRequest'
        is_active:
          type: boolean
      required:
      - code
      - name
      - tiers
    ConfigResponse:
      type: object
      properties:
        min_supported_version:
          type: string
        enabled_currencies:
          type: array
          items:
            type: string
        map_tile_url:
          type: string
        map_tile_attribution:
          type: string
        stay_max_nights:
          type: integer
        features:
          type: object
          additionalProperties:
            type: boolean
      required:
      - enabled_currencies
      - features
      - map_tile_attribution
      - map_tile_url
      - min_supported_version
      - stay_max_nights
    ConfirmationModeEnum:
      enum:
      - INSTANT
      - ON_REQUEST
      type: string
      description: |-
        * `INSTANT` - Confirms immediately
        * `ON_REQUEST` - Confirmed by the provider
    Country:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        iso_code:
          type: string
        name:
          type: string
        default_currency:
          type: string
        default_timezone:
          type: string
      required:
      - default_currency
      - default_timezone
      - iso_code
      - name
      - public_id
    CountryWriteRequest:
      type: object
      description: |-
        §7.3's `country`.

        `min_latitude`, `min_longitude`, `max_latitude` and `max_longitude` are the
        bounding box of this market. Every coordinate written to a destination,
        attraction, activity or accommodation beneath this country is required to
        fall inside it, which is what catches a latitude and longitude entered the
        wrong way round — both halves of a transposed pair are individually valid.

