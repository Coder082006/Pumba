          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        max_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
      required:
      - default_currency
      - default_timezone
      - iso_code
      - max_latitude
      - max_longitude
      - min_latitude
      - min_longitude
      - name
