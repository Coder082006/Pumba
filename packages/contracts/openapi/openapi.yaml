        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceTransitionResult'
          description: ''
  /api/v1/admin/bookings/{public_id}/voucher:
    post:
      operationId: admin_bookings_voucher_create
      description: 'BR-038 names the role, not a permission: "only with the SUPER_ADMIN
        role".'
      summary: Re-issue a booking's voucher
