openapi: 3.1.0
info:
  title: Tourism Journey Orchestration Platform API
  version: 1.0.0
  description: Client-agnostic REST API. Consumed by the tourist website, the provider
    portal, the administration console and (later) the Flutter applications. No client-specific
    concern may leak into this contract.
paths:
  /api/v1/accommodation:
    get:
      operationId: accommodation_list
      description: 'Curated location records — ADR 0013. The Platform does not sell
        the room in v1, so there is no availability, no rate and no date filter: this
        is the list §24.11 offers a tourist naming where they already intend to stay.'
      summary: List curated accommodation locations
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: destination
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
      - in: query
        name: property_type
        schema:
          type: array
          items:
            enum:
            - HOTEL
            - RESORT
            - LODGE
            - GUESTHOUSE
            - APARTMENT
            type: string
            description: |-
              * `HOTEL` - Hotel
              * `RESORT` - Resort
              * `LODGE` - Lodge
              * `GUESTHOUSE` - Guesthouse
              * `APARTMENT` - Apartment
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Accommodation'
          description: ''
  /api/v1/accommodation/{reference}:
    get:
      operationId: accommodation_retrieve
      description: One row, or 404 — whether it is missing or merely not public yet.
      summary: Read one accommodation location
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
          description: ''
  /api/v1/activities:
    get:
      operationId: activities_list
      description: |-
        Unauthenticated, throttled, and named so the URL-conf audit sees it.

        §9.3.2 makes these public. §9.6 throttles them by IP, because they are the
        only unauthenticated endpoints that run a seven-term ordering over a joined
        query, which makes them the cheapest thing here to point a script at.
      summary: List activities
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: destination
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
      - in: query
        name: sort
        schema:
          enum:
          - recommended
          - price_asc
          - price_desc
          - rating
          - duration
          - distance
          type: string
          minLength: 1
        description: |-
          * `recommended` - recommended
          * `price_asc` - price_asc
          * `price_desc` - price_desc
          * `rating` - rating
          * `duration` - duration
          * `distance` - distance
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[-a-zA-Z0-9_]+$
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/activities/{reference}:
    get:
      operationId: activities_retrieve
      description: One row, or 404 — whether it is missing or merely not public yet.
      summary: Read one activity
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
          description: ''
  /api/v1/activities/{reference}/departures:
    get:
      operationId: activities_departures_list
      description: |-
        Sellable departures for one activity, with the seats remaining on each.

        **These figures are indicative and every row says so.** SRS §17.1 principle I3: *search may read cached or stale capacity; committing a booking may not.* The authoritative check happens under a row lock inside `POST /trips/{id}/quote`, and a `basis` of `INDICATIVE` here means precisely that this number must not be used to promise anybody a seat.

        Supplying `pax` turns the list into advice: each row then carries `unbookable` — `SOLD_OUT`, `PAST_CUTOFF`, `PARTY_TOO_LARGE` and the rest — so a client can say why a date it is showing cannot be taken. Cancelled departures are listed rather than hidden: a date that silently vanishes reads as a bug to somebody who was looking at it a minute ago.
      summary: List an activity's departures
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: pax
        schema:
          type: integer
          maximum: 99
          minimum: 1
      - in: path
        name: reference
        schema:
          type: string
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - inventory
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departure'
          description: ''
  /api/v1/admin/accommodation:
    post:
      operationId: admin_accommodation_create
      description: |-
        POST one new curated row.

        Deliberately not a `ScopedQuerysetMixin` view. There is no row to scope
        yet, so a filter here would provably run against nothing while reporting to
        the §37.2 matrix that ownership was enforced. What stands between a caller
        and a new row is the role check, and the matrix records that by name in
        `NO_ROWS_EXPOSED` rather than by an inherited class that does nothing.
      summary: Create a accommodation
      tags:
      - catalogue-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccommodationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccommodationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccommodationWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
          description: ''
  /api/v1/admin/accommodation/{public_id}:
    patch:
      operationId: admin_accommodation_partial_update
      description: |-
        A partial update — including the one that opens or closes a market.

        §4.1 wants a destination published and withdrawn without a deployment,
        and both are `is_active` moving in this one call. There is deliberately
        no separate activate endpoint, so there is no second path that could
        record the change differently or not at all.
      summary: Amend a accommodation
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalogue-admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccommodationWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccommodationWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccommodationWriteRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
          description: ''
    delete:
      operationId: admin_accommodation_destroy
      description: §7.7's soft deletion. The row survives; the slug is released.
      summary: Retire a accommodation
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalogue-admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/accommodation/{public_id}/restore:
    post:
      operationId: admin_accommodation_restore_create
      description: |-
        Undo a soft deletion.

        A POST to its own resource rather than a PATCH setting `deleted_at`.
        `deleted_at` is not a writable field, and adding it to the update
        serializer to support this would open the mass-assignment hole that
        `repositories._WRITABLE` exists to close.
      summary: Restore a retired accommodation
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - catalogue-admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
