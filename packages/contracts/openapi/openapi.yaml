  /api/v1/admin/bookings/{public_id}/force-transition:
    post:
      operationId: admin_bookings_force_transition_create
      description: BR-038. Guards are bypassed; SRS 20.2's edges are not — an undeclared
        transition is 409 ILLEGAL_TRANSITION for a SUPER_ADMIN too. A reason is required
        and the action is always audited.
      summary: Force a booking along a declared transition
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForceTransitionRequest'
          multipart/form-data:
            schema:
