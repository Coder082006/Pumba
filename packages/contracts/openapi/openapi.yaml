        * `RESORT` - Resort
        * `LODGE` - Lodge
        * `GUESTHOUSE` - Guesthouse
        * `APARTMENT` - Apartment
    ProviderBalance:
      type: object
      properties:
        currency:
          type: string
          readOnly: true
        pending:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        available:
