  /api/v1/attractions:
    get:
      operationId: attractions_list
      description: |-
        Unauthenticated, throttled, and named so the URL-conf audit sees it.

        §9.3.2 makes these public. §9.6 throttles them by IP, because they are the
        only unauthenticated endpoints that run a seven-term ordering over a joined
        query, which makes them the cheapest thing here to point a script at.
      summary: List attractions
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: destination
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
      - in: query
        name: sort
        schema:
          enum:
          - recommended
          - price_asc
          - price_desc
          - rating
          - duration
          - distance
          type: string
          minLength: 1
        description: |-
          * `recommended` - recommended
          * `price_asc` - price_asc
          * `price_desc` - price_desc
          * `rating` - rating
          * `duration` - duration
          * `distance` - distance
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[-a-zA-Z0-9_]+$
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attraction'
          description: ''
