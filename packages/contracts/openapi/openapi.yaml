      type: object
      description: |-
        §7.3's `country`.

        `min_latitude`, `min_longitude`, `max_latitude` and `max_longitude` are the
        bounding box of this market. Every coordinate written to a destination,
        attraction, activity or accommodation beneath this country is required to
        fall inside it, which is what catches a latitude and longitude entered the
        wrong way round — both halves of a transposed pair are individually valid.

        Set `min_longitude` greater than `max_longitude` for a country that crosses
        the antimeridian.
      properties:
        iso_code:
          type: string
          minLength: 2
          maxLength: 2
        name:
          type: string
          minLength: 1
          maxLength: 80
        default_currency:
          type: string
          minLength: 3
          maxLength: 3
        default_timezone:
          type: string
          minLength: 1
          maxLength: 60
        is_active:
          type: boolean
        min_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        min_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        max_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        max_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
    PatchedDestinationWriteRequest:
      type: object
      description: |-
        §7.5.6.

        `is_active` is optional and the model defaults it to false. A market is
        staged, then published — §41.12 asks an administrator to open Arusha, and
        "created" and "open" are two decisions with a review in between.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        region:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        summary:
          type:
          - string
          - 'null'
          minLength: 1
        description:
          type: string
        timezone:
          type: string
          minLength: 1
          maxLength: 60
        default_currency:
          type: string
          minLength: 3
          maxLength: 3
        is_gateway:
          type: boolean
        gateway_type:
          oneOf:
          - $ref: '#/components/schemas/GatewayTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        gateway_code:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 10
        launch_date:
          type:
          - string
          - 'null'
          format: date
        feature_rank:
          type: integer
          minimum: 1
        is_active:
          type: boolean
