        activity:
          type: string
          format: uuid
        days:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 16
        start_time:
          type: string
          format: time
        capacity:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date
        valid_to:
