      - available
      - currency
      - pending
    ProviderContact:
      type: object
      description: '§9.3.5: the detail carries "provider contact".'
      properties:
        name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
      required:
      - email
      - name
      - phone
    ProviderDeparture:
      type: object
      description: |-
        One departure with all three counters — §26.5's grid cell.

        The public `DepartureSerializer` above publishes `remaining` and refuses to
        publish the split. This one publishes it, because the split is the whole
        point of an operator's calendar: eight taken seats of which four are holds
        is a boat being booked, and eight of which four are sales with a hold
        expiring in ten minutes is a boat about to have a free seat. A provider
        deciding whether to cancel needs to tell those apart; a tourist reading the
        same number would watch availability move for no visible reason.

        Two serializers rather than one with a flag, so widening the tourist-facing
        payload stays something somebody has to do deliberately.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        departs_at:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          readOnly: true
        capacity_total:
          type: integer
          readOnly: true
        capacity_held:
          type: integer
          readOnly: true
        capacity_sold:
          type: integer
          readOnly: true
        remaining:
          type: integer
          readOnly: true
        price_override:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - capacity_held
      - capacity_sold
      - capacity_total
      - departs_at
      - price_override
      - public_id
      - remaining
      - status
    ProviderEarnings:
      type: object
      description: |-
        §26.7's figures, served to an administrator until Phase 11's portal.

        Every field is declared rather than passed through: the service hands back
        a frozen DTO (§6.5 rule 5), and a `ListField` given dataclasses renders
        objects a JSON encoder cannot take.
