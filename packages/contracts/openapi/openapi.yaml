          type: string
          format: uuid
        market:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        is_active:
          type: boolean
