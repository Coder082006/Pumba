          readOnly: true
        legal_name:
          type: string
          readOnly: true
        trading_name:
          type: string
          readOnly: true
        provider_type:
          type: string
          readOnly: true
        contact_email:
          type: string
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        region:
          type: string
          readOnly: true
