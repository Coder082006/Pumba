        id:
          type: string
          format: uuid
          readOnly: true
        payment_id:
          type: string
          format: uuid
          readOnly: true
        booking_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        reason_code:
          type: string
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        failure_code:
          type: string
          readOnly: true
      required:
