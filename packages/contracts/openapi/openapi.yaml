    VehicleClass:
      type: object
      description: |-
        §9.3.4: "Classes with capacity and indicative pricing".

        Capacity, and no price. A class does not have a price — a *route* priced
        for a class does — so a number here would be a quote nobody asked for and
        nobody could be held to. §24.16's cards get theirs from
        `POST /transport/quotes`, which knows the leg.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        seats:
          type: integer
          readOnly: true
        luggage_capacity:
          type: integer
          readOnly: true
        has_air_conditioning:
          type: boolean
          readOnly: true
      required:
      - code
      - description
      - has_air_conditioning
      - id
      - luggage_capacity
      - name
      - seats
    VerifyEmailCodeRequest:
      type: object
      description: |-
        §24.3's popup: the address just registered, and the six digits emailed.

        The email is carried rather than inferred from a session, because there is
        no session yet — the account is PENDING and cannot sign in until this
        succeeds. Digits only, exactly six: a code that arrived with a space or a
        non-breaking hyphen from a mail client should be cleaned by the client, and
        anything else is not a code this service ever issued.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        code:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - code
      - email
    VerifyEmailRequest:
      type: object
      description: |-
        Rejects unknown fields — SRS §30.6.

        DRF ignores them by default, which turns a client's typo into silence and
        lets a renamed field keep "working" while doing nothing.

        It is also half of the write path's mass-assignment defence. The other
        half is `apps.catalogue.repositories._WRITABLE`, and the duplication is
        deliberate: this one gives the administrator a 422 naming the field they
        got wrong, and that one holds even for a caller that never passed through
        a serializer — the seed loader, a management command, a console shell.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
