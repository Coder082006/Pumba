      - end_date
      - start_date
    DeclineRequestRequest:
      type: object
      description: |-
        Rejects unknown fields — SRS §30.6.

        DRF ignores them by default, which turns a client's typo into silence and
        lets a renamed field keep "working" while doing nothing.

        It is also half of the write path's mass-assignment defence. The other
        half is `apps.catalogue.repositories._WRITABLE`, and the duplication is
        deliberate: this one gives the administrator a 422 naming the field they
        got wrong, and that one holds even for a caller that never passed through
        a serializer — the seed loader, a management command, a console shell.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    Departure:
      type: object
      description: |-
        One departure — §7.5.9's row as §24.10 renders it.

        **`remaining`, not the three counters.** Publishing `capacity_held` would
        tell a tourist how many seats somebody else is midway through paying for: a
        number that is nobody's business, that changes with nothing happening, and
        that reads as availability disappearing for no reason.

        **`basis` is always present.** §17.1 I3 and §8.10: this figure may be stale
        and may never confirm a booking. A payload that said so only sometimes
        would be one a client learns to ignore.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        departs_at:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          readOnly: true
        remaining:
          type: integer
          readOnly: true
        basis:
          type: string
          readOnly: true
        price_override:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        unbookable:
          type:
          - string
          - 'null'
          readOnly: true
        is_bookable:
          type: boolean
          readOnly: true
      required:
      - basis
      - departs_at
      - is_bookable
      - price_override
      - public_id
      - remaining
      - status
      - unbookable
    DepartureEditRequest:
      type: object
      description: |-
        §26.5's bulk submission: a window, an optional weekday mask, and the ops.

        *"Bulk editing supports a date range, a weekday mask, and set-availability /
        set-rate / open / close operations in one submission."*

        **`days`, not a bitmask**, matching the schedule console: a provider closing
        Sundays types "sun", and a form that took `64` would be one nobody can
        review. `catalogue.services.weekday_mask` is the same conversion the
        schedule form and the seed file use, so all three agree about which bit is
        Monday — and it is reached through the service interface because contract
        `private-catalogue` forbids this module the domain one.

        **An empty submission is refused.** A body naming a window and no operation
        would lock a month of rows, change none of them and answer 200 with a count
        of zero — indistinguishable from a window that matched nothing.

        **`clear_price` exists because `null` is ambiguous.** `price_override: null`
        has to mean "leave it alone", or every capacity edit would silently drop a
        special rate. Removing one is its own flag, and asking for both at once is
        a contradiction rather than a precedence rule to remember.
      properties:
        date_from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 16
        capacity_total:
          type: integer
          minimum: 0
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        clear_price:
          type: boolean
          default: false
        status:
          $ref: '#/components/schemas/DepartureEditStatusEnum'
      required:
      - date_from
      - to
    DepartureEditStatusEnum:
      enum:
      - OPEN
      - CLOSED
      - CANCELLED
      type: string
      description: |-
        * `OPEN` - OPEN
        * `CLOSED` - CLOSED
        * `CANCELLED` - CANCELLED
    Destination:
      type: object
      description: |-
        §7.5.6.

        `timezone` is here because §7.2 renders timestamps in the destination's
        zone and §15.2 evaluates opening hours in it. A client holding a
