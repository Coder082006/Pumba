          readOnly: true
        tax_amount:
          type: string
          readOnly: true
        total_amount:
          type: string
          readOnly: true
      required:
      - currency
      - expires_at
      - fee_amount
      - held_seats
      - quote_token
      - status
      - subtotal_amount
      - tax_amount
      - total_amount
      - trip_public_id
    QuotePreviewRequest:
      type: object
      description: |-
        §27.11's "quote-preview tool for any origin-destination-class
        combination".

        `pickup_at` is not in §27.11's one-line description and is accepted anyway.
        §12.4's night surcharge is evaluated against "pickup_at local time", so a
        preview with no instant could not show an administrator the surcharged
        price at all — which is the price most worth previewing, because it is the
        one a tourist queries.
      properties:
        origin_destination:
          type: string
          minLength: 1
        target_destination:
          type: string
          minLength: 1
        pax:
          type: integer
          minimum: 1
          default: 2
        luggage:
          type: integer
          minimum: 0
          default: 2
        pickup_at:
          type: string
          format: date-time
        distance_m:
          type: integer
          minimum: 0
        travel_seconds:
          type: integer
          minimum: 0
      required:
      - origin_destination
      - target_destination
    QuotePreviewResult:
      type: object
      properties:
        origin:
          type: string
          readOnly: true
        target:
          type: string
          readOnly: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/PreviewOption'
          readOnly: true
      required:
      - options
      - origin
      - target
    RefreshRequest:
      type: object
      description: |-
        Rejects unknown fields — SRS §30.6.

        DRF ignores them by default, which turns a client's typo into silence and
        lets a renamed field keep "working" while doing nothing.

        It is also half of the write path's mass-assignment defence. The other
        half is `apps.catalogue.repositories._WRITABLE`, and the duplication is
        deliberate: this one gives the administrator a 422 naming the field they
        got wrong, and that one holds even for a caller that never passed through
        a serializer — the seed loader, a management command, a console shell.
      properties:
        refresh_token:
          type: string
    RefundRead:
      type: object
