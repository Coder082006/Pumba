        legal_name:
          type: string
          minLength: 1
          maxLength: 200
        trading_name:
          type: string
          minLength: 1
          maxLength: 200
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        contact_email:
          type: string
          format: email
          minLength: 1
        contact_phone:
          type: string
          minLength: 1
          maxLength: 20
        region:
          type: string
          minLength: 1
        payout_account_ref:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 120
        payout_currency:
          type: string
          minLength: 1
          maxLength: 3
    Quote:
      type: object
      description: A priced, inventory-backed, time-boxed offer.
      properties:
        quote_token:
          type: string
          format: uuid
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        held_seats:
          type: integer
          readOnly: true
