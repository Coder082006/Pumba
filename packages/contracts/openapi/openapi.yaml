          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{public_id}/voucher:
    post:
      operationId: bookings_voucher_create
      description: '`POST /bookings/{id}/voucher` — T, "Generate/download PDF voucher"
        (ADR 0026).'
      summary: Download this booking's voucher
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - booking
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/config:
    get:
      operationId: config
      description: 'Resolves the values a client needs before it can show anything:
        the minimum supported client version (SRS §23.13), the currencies a tourist
        may choose, the base-map tile URL and its required attribution, the BR-101
        bound on a stay''s length, and the feature-flag set (§35). The response carries
        an explicit allow-list of settings and never the wider `system_setting` register.'
      summary: Client configuration and feature flags
      tags:
      - config
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
          description: ''
  /api/v1/destinations:
    get:
      operationId: destinations_list
      description: §9.3.2. Also the source `app/sitemap.ts` enumerates (commit 34).
      summary: List published destinations
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: is_gateway
        schema:
          type: boolean
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
      - in: query
        name: region
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
          description: ''
  /api/v1/destinations/{reference}:
    get:
      operationId: destinations_retrieve
      description: One row, or 404 — whether it is missing or merely not public yet.
      summary: Read one destination
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
          description: ''
  /api/v1/health:
    get:
      operationId: health
      description: Reports process liveness and the reachability of PostgreSQL and
        Redis. Returns 503 when any dependency is unreachable so that a load balancer
        removes the instance from rotation.
      summary: Liveness and readiness probe
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailableResponse'
          description: ''
  /api/v1/markets:
    get:
      operationId: markets_list
      description: 'Every *listed* market, which is not the same set as every open
        one. A market that has been announced but whose catalogue is not yet browsable
        appears here with `is_open: false`, because §24.6''s destination selector
        has to name it. Nothing beneath such a market is reachable. Unpaginated: `market`
        is administered, so its size is a business decision rather than a caller''s.'
      summary: List markets the Platform names
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Market'
          description: ''
  /api/v1/markets/{reference}:
    get:
      operationId: markets_retrieve
      description: Resolves a listed market by slug or `public_id`. Unlike every other
        detail endpoint this one answers for a market that has not opened — that is
        the announcement page, and 404 would make the selector tile lead nowhere.
        Read `is_open` to tell the two apart.
      summary: Read one market
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Market'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: |-
        The caller's own account.

        No `ownership_resource`: the row is selected *by* the principal rather
        than looked up by an identifier the caller supplies, so there is no
        identifier to get wrong. The URL-conf audit lists it for that reason.
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: me_partial_update
      description: |-
        §24.28: "Language, presentment currency".

        The currency here is what prices are *shown* in — §9.1's `X-Currency`
        applies per request, this is the standing preference behind it. It is
        never what the tourist is charged in: that is `trip.currency`, taken
        from the destination and locked at first pricing (BR-016), and §18.4
        gives it an entirely separate mechanism (ADR 0024).
      summary: Change your language or the currency prices are shown in
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/me/devices:
    get:
      operationId: me_devices_list
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
    post:
      operationId: me_devices_create
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/me/devices/{public_id}:
    delete:
      operationId: me_devices_destroy
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/payments/{public_id}:
    get:
      operationId: payments_retrieve
      description: |-
        `GET /payments/{id}` — §9.3.7.

        A payment that is not this tourist's is absent rather than forbidden
        (§30.3), which the service enforces by filtering rather than comparing.
      summary: Payment status
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payment
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/{public_id}/verify:
    post:
      operationId: payments_verify_create
      description: |-
        `POST /payments/{id}/verify` — §9.3.7.

        What the waiting screen calls. A tourist completing a 3-D Secure challenge
        watches a page that has no way of knowing the webhook arrived, and polling
        the gateway on their behalf is better than either a spinner that never
        stops or a page that claims success it has not been told about.

        No `Idempotency-Key`: this creates nothing. Asking twice asks the gateway
        twice and writes whatever it says, which is the same answer.
      summary: Refresh a payment's status from the provider
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payment
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/intents:
    post:
      operationId: payments_intents_create
      description: 'The amount is computed from the trip and is never taken from the
        request (BR-060). Returns a method-specific action: a client secret for a
        card, a redirect, or a mobile-money prompt. `Idempotency-Key` is required.'
      summary: Start paying for a reserved trip
      tags:
      - payment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/methods:
    get:
      operationId: payments_methods_list
      description: |-
        `GET /payments/methods` — §9.3.7.

        §9.3.7 describes this as the methods available "for the tourist's country
        and currency". In 8a there is one rail and the honest answer is short: cards
        in the currencies §18.3 supports, and mobile money named as not yet
        available rather than omitted — a tourist in Zanzibar who is offered no
        mobile money should be told why, not left to wonder.
      summary: Payment methods available to this tourist
      tags:
      - payment
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
          description: ''
  /api/v1/refunds:
    get:
      operationId: refunds_list
      description: §27.10's refund queue, and §9.3.7's `POST /refunds`.
      summary: Refund queue
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: REQUESTED, SETTLED or FAILED
      tags:
      - Administration
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundRead'
          description: ''
    post:
      operationId: refunds_create
      description: '§21.6. A refund following a cancellation policy is written automatically
        and never passes through here. BR-047: above `refund.auto_approve_limit` the
        caller must hold REFUND_APPROVE.'
      summary: Issue a discretionary refund
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRead'
          description: ''
  /api/v1/search:
    get:
      operationId: search_list
      description: 'Full-text search across destinations, attractions, activities
        and accommodation, merged into one relevance-ordered list. A bounded top-N
        rather than a paginated walk: the way to see more of one kind is that kind''s
        listing endpoint.'
      summary: Search the catalogue
      parameters:
      - in: query
        name: kind
        schema:
          type: array
          items:
            enum:
            - destination
            - attraction
            - activity
            - accommodation
            type: string
            description: |-
              * `destination` - destination
              * `attraction` - attraction
              * `activity` - activity
              * `accommodation` - accommodation
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
        required: true
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
          description: ''
  /api/v1/tags:
    get:
      operationId: tags_list
      description: 'The §24.7 category chips. Rows, not code: adding an interest is
        an administrator action and reaches the chip strip with no deployment, and
        retiring one removes it the same way.'
      summary: List the interest vocabulary
      tags:
      - catalogue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
  /api/v1/transport/corridors:
    get:
      operationId: transport_corridors_list
      description: 'The origin-destination pairs the platform runs transfers between,
        by vehicle class. No fare: a corridor''s price depends on the class and the
        date, so fares come from POST /transport/quotes (SRS 9.3.4, 12.4).'
      summary: List transfer corridors
      tags:
      - Transport
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Corridor'
          description: ''
  /api/v1/transport/quotes:
    post:
      operationId: transport_quotes_create
      description: Prices each leg for every vehicle class the party fits, using the
        SRS 12.4 resolution ladder. Returns 422 NO_TARIFF_CONFIGURED when no corridor
        or fallback tariff matches, and 502 ROUTING_UNAVAILABLE when a metered leg
        cannot be measured — never a guessed price (SRS 12.6).
      summary: Quote one or more transfer legs
      tags:
      - Transport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferQuoteRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegQuote'
          description: ''
  /api/v1/transport/vehicle-classes:
    get:
      operationId: transport_vehicle_classes_list
      description: 'The vehicle classes a transfer may be quoted for, with seat and
        luggage capacity. Capacity only: a class has no price of its own — a route
        priced for a class does — so fares come from POST /transport/quotes, which
        knows the leg (SRS 12.4, 24.16).'
      summary: List vehicle classes
      tags:
      - Transport
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleClass'
          description: ''
  /api/v1/trips:
    get:
      operationId: trips_list
      description: §24.20's My Trips — summaries, not full trips.
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
          description: ''
    post:
      operationId: trips_create
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
  /api/v1/trips/{public_id}:
    get:
      operationId: trips_retrieve
      description: |-
        A trip that is not this tourist's is absent, not forbidden (§30.3).

        `services.get_trip` returns `None` for both a foreign trip and one that
        never existed, and this raises the same error for both — so the two are
        indistinguishable from outside, which is the point.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    patch:
      operationId: trips_partial_update
      description: Authenticated, and a tourist. Ownership is the service's, not ours.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTripRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTripRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateTripRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
    delete:
      operationId: trips_destroy
      description: |-
        §24.24's Drafts: a plan thrown away, not a booking cancelled.

        204 rather than the trip, because unlike every other mutation here
        there is nothing left to render. A trip with bookings behind it is a
        409 naming `cancel` instead, raised by the service.
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/trips/{public_id}/cancel:
    post:
      operationId: trips_cancel_create
      description: 'BR-046: every live component is evaluated against its own snapshotted
        policy and the refund is itemised. If any component can no longer be cancelled
        (it has started), nothing is cancelled and the response is 409 CANCELLATION_NOT_PERMITTED
        naming each one.'
      summary: Cancel a whole trip, each component under its own policy
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trip
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCancellation'
          description: ''
  /api/v1/trips/{public_id}/cancellation-preview:
    get:
      operationId: trips_cancellation_preview_retrieve
      description: |-
        What cancelling the whole trip would refund, before anybody does it.

        §20.9 promises "the tourist always sees the financial consequence before
        acting" and itemises trip-level cancellation, but §9.3 lists a preview only
        per booking. A trip-level preview is the same promise at the level the
        cancel button acts on; it writes nothing.
      summary: Preview cancelling a whole trip
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trip
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripCancellation'
          description: ''
  /api/v1/trips/{public_id}/confirm:
    post:
      operationId: trips_confirm_create
      description: |-
        SRS §9.4.6. Creates one booking per component in `PENDING`, snapshots each component's cancellation policy and commission rate, moves the trip to `PENDING_PAYMENT` and extends the held capacity to the payment window. **Nothing is committed and no provider is notified** — that happens on payment capture.

        **409 `QUOTE_EXPIRED`**: the quote lapsed or was superseded; no booking is created. **409 `TRIP_NOT_PAYABLE`**: the trip is not priced, or has nothing bookable. **409 `NOT_BOOKABLE`**: a component has no verified seller or starts in the past; `details` names each. **409 `PRICE_CHANGED`**: a transfer fare moved since the quote. **409 `HOLD_EXPIRED`**: held capacity lapsed.
      summary: Create the booking basket from an accepted quote
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: A client-generated key unique to this attempt. Repeating the
          request with the same key returns the first basket and creates no second
          one.
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Basket'
          description: ''
  /api/v1/trips/{public_id}/flights:
    put:
      operationId: trips_flights_update
      description: '§9.4.2 is a PUT: the whole set replaces what is there.'
      parameters:
