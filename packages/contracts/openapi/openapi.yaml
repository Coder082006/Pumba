          readOnly: true
        breakdown:
          type: object
          additionalProperties: {}
          readOnly: true
        matched_kind:
          type: string
          readOnly: true
        matched_rule:
          type: string
          format: uuid
          readOnly: true
        matched_step:
          type: integer
          readOnly: true
