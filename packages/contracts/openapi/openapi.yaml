  /api/v1/admin/activities/{public_id}/departures:
    get:
      operationId: admin_activities_departures_list
      description: |-
        §26.5's month grid: every departure in the window with its capacity, what is held, what is sold and any price override.

        Unlike the public calendar this publishes the three counters separately, because the split is what an operator is deciding on — eight taken seats of which four are holds is a boat being booked, not a boat that is full.
      summary: An activity's departure calendar
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: pax
        schema:
          type: integer
          maximum: 99
          minimum: 1
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - inventory
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderDeparture'
          description: ''
    put:
      operationId: admin_activities_departures_update
      description: |-
        §26.5's bulk edit: a date range, an optional weekday mask, and set-availability / set-rate / open / close in one submission.

        **BR-023.** A capacity below what a departure has already held or sold is refused with `409 CAPACITY_BELOW_COMMITTED`, and every offending date is named in `details` with what was asked for and what is committed. Held seats count: a hold is a seat somebody is partway through paying for.

        Reducing capacity does not cancel anybody, and cancelling does not release anybody's money — §14.6's refund path is separate and deliberate.
      summary: Bulk-edit an activity's departures
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartureEditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepartureEditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepartureEditRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/activities/{public_id}/provider:
    put:
      operationId: admin_activities_provider_update
      description: Assigning a listing is a catalogue edit, so CATALOGUE_MANAGE gates
