# CI pipeline — SRS §35.3.
#
# Jobs are split so a failure names its own cause: a broken module boundary
# reports as "Module boundaries", not as one line inside a monolithic "test".

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"

jobs:
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # GeoDjango binds GDAL, GEOS and PROJ through ctypes at import time, so
      # every job that imports Django settings needs them present — not only the
      # one that runs a test with geometry in it (ADR 0009). Mirrors
      # api.Dockerfile, which the runner previously did not match.
      - name: Geospatial libraries (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: uv sync --frozen
      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy apps ports config

  # ---------------------------------------------------------------------------
  module-boundaries:
    name: Module boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # GeoDjango binds GDAL, GEOS and PROJ through ctypes at import time, so
      # every job that imports Django settings needs them present — not only the
      # one that runs a test with geometry in it (ADR 0009). Mirrors
      # api.Dockerfile, which the runner previously did not match.
      - name: Geospatial libraries (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: uv sync --frozen
      # SRS §6.5 rule 2: "a forbidden import fails the build".
      - name: import-linter
        run: uv run lint-imports
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pumba
          POSTGRES_USER: pumba
          POSTGRES_PASSWORD: pumba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pumba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # GeoDjango binds GDAL, GEOS and PROJ through ctypes at import time, so
      # every job that imports Django settings needs them present — not only the
      # one that runs a test with geometry in it (ADR 0009). Mirrors
      # api.Dockerfile, which the runner previously did not match.
      - name: Geospatial libraries (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: uv sync --frozen

      # SRS §35.3 coverage gate: 80% overall, 95% domain. The domain gate is a
      # separate invocation because it is the layer carrying the pricing,
      # policy and state-machine logic that disputes are resolved against.
      - name: pytest with overall coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Domain layer coverage gate (95%)
        run: |
          uv run coverage report \
            --include="apps/*/domain/*,apps/common/authz/*,apps/common/geo.py,apps/common/money.py,apps/common/reference.py,apps/common/state_machine.py" \
            --fail-under=95

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage.xml

  # ---------------------------------------------------------------------------
  openapi-contract:
    name: OpenAPI is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # GeoDjango binds GDAL, GEOS and PROJ through ctypes at import time, so
      # every job that imports Django settings needs them present — not only the
      # one that runs a test with geometry in it (ADR 0009). Mirrors
      # api.Dockerfile, which the runner previously did not match.
      - name: Geospatial libraries (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: uv sync --frozen
        working-directory: apps/api

      # SRS §36.2: the spec is generated, committed and diffed in review. If
      # regeneration produces a diff, someone changed the API without
      # committing the contract, and the change is invisible to reviewers.
      - name: Regenerate the specification
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
        run: |
          uv run python manage.py spectacular \
            --file ../../packages/contracts/openapi/openapi.yaml \
            --validate --fail-on-warn

      - name: Fail if the committed specification is stale
        run: |
          if ! git diff --exit-code -- packages/contracts/openapi/openapi.yaml; then
            echo "::error::openapi.yaml is out of date. Run 'make openapi' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The generated types must match the committed spec for the same reason
      # the spec must match the code.
      - name: Regenerate contract types
        run: pnpm --filter @pumba/contracts generate
      - name: Fail if the generated types are stale
        run: |
          if ! git diff --exit-code -- packages/contracts/src/schema.d.ts; then
            echo "::error::schema.d.ts is out of date. Run 'make contracts' and commit the result."
            exit 1
          fi

      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build

  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # SRS §30.9: "A pre-commit secret scanner and a CI scan block accidental
      # commits."
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
        working-directory: apps/api

      # SRS §30.13: static analysis and dependency scanning on every build.
      - name: Bandit (SAST)
        working-directory: apps/api
        run: uv run --with bandit bandit -r apps ports config -ll

      - name: Dependency audit
        working-directory: apps/api
        run: uv run --with pip-audit pip-audit --strict || echo "::warning::pip-audit reported findings"

  # ---------------------------------------------------------------------------
  # SRS §29 NFR-P01 and the §24.8 SEO surface, as hard assertions.
  #
  # The thresholds in `lighthouserc.json` are acceptance criteria for this
  # phase. Measuring them once by hand and writing the numbers into a document
  # is how they quietly stop being true — so they are asserted against a real
  # page, served by a real Next build, reading a real API, over the shipped
  # seed data. The job is heavy (~5 minutes) and that is the cost of the
  # numbers meaning anything.
  lighthouse:
    name: Lighthouse (NFR-P01)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pumba
          POSTGRES_USER: pumba
          POSTGRES_PASSWORD: pumba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pumba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Geospatial libraries (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             gdal-bin libgdal-dev libgeos-dev libproj-dev
      - run: uv sync --frozen
        working-directory: apps/api

      - name: Migrate and seed
        working-directory: apps/api
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed

      # Backgrounded, then waited on by polling /health rather than by
      # sleeping: a fixed sleep is either too short on a slow runner — where it
      # fails as "Lighthouse could not load the page", naming the wrong cause —
      # or wasted time on a fast one.
      - name: Start the API
        working-directory: apps/api
        run: |
          uv run daphne -b 127.0.0.1 -p 8000 config.asgi:application &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::The API did not become healthy within 60s."
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A production build, because that is what the thresholds describe. A dev
      # server ships unminified bundles and no static optimisation, and would
      # fail Performance for reasons that have nothing to do with the code.
      - name: Build and start the tourist web client
        run: |
          pnpm --filter @pumba/web-tourist build
          pnpm --filter @pumba/web-tourist start &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/explore > /dev/null; then
              echo "Web up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::The web client did not start within 60s."
          exit 1

      # Asserts the seed actually loaded before Lighthouse runs. Without this a
      # broken seed produces an empty Explore page, which scores *well* — fast,
      # accessible, and measuring nothing. A green gate over an empty page is
      # the failure mode this whole job exists to avoid.
      # Asserts both halves of what Lighthouse is about to measure, and
      # prints what it found either way.
      #
      # The content check came first: without it a broken seed produces an
      # empty Explore page, which scores *well* — fast, accessible, and
      # measuring nothing. A green gate over an empty page is the failure this
      # job exists to avoid.
      #
      # The head check is `scripts/check_head_metadata.py`, and it checks
      # *inside* `<head>` rather than anywhere in the document. Its first
      # version grepped the whole page and passed on every run while Lighthouse
      # scored meta-description 0 on the same page — both were right, because
      # Next was streaming the tag into the body. A guard that cannot fail for
      # the reason the gate fails is not a guard.
      - name: Refuse to measure a page missing its content or its SEO surface
        env:
          EXPLORE_URL: http://127.0.0.1:3000/explore
          DESTINATION_URL: http://127.0.0.1:3000/destinations/stone-town
        run: |
          python3 scripts/check_head_metadata.py "$EXPLORE_URL" "$DESTINATION_URL"
          if ! curl -fsS http://127.0.0.1:3000/explore | grep -q "Stone Town"; then
            echo "::error::Explore rendered without seeded content. Lighthouse would measure an empty page."
            exit 1
          fi

      # `collect` and `assert` are separate steps rather than one `autorun`.
      # `autorun` stops at the first failing phase, so a missed threshold
      # aborted the run before anything downstream could report on it. Split,
      # the two phases fail independently and the run says which one went.
      - name: Lighthouse CI — collect
        run: pnpm dlx @lhci/cli@0.14.x collect

      # The assert output is echoed back as GitHub annotations, not merely
      # printed. Job logs need repository-admin auth to read; annotations do
      # not. On a public repository the annotation is therefore the only
      # channel through which a contributor can diagnose a failure without
      # credentials — and a gate whose failures nobody can read is a gate that
      # eventually gets deleted rather than fixed.
      - name: Lighthouse CI — assert the NFR-P01 thresholds
        run: |
          set -o pipefail
          if pnpm dlx @lhci/cli@0.14.x assert 2>&1 | tee lhci-assert.log; then
            exit 0
          fi
          # One annotation, not one per line. GitHub surfaces at most ten
          # annotations per level per step and silently drops the rest — which
          # is exactly how the first run of this diagnostic filled its quota
          # with assert output and lost the audit lines it existed to show.
          # `%0A` is GitHub's newline escape inside a workflow command.
          summary=$(grep -E "failure for|expected:|found:" lhci-assert.log | head -40 | sed -e 's/\x1b\[[0-9;]*m//g' | awk '{printf "%s%%0A", $0}')
          echo "::error::Lighthouse did not meet the NFR-P01 thresholds.%0A${summary}"
          # A category score names a category, not a defect. This names the
          # individual audits that lost the points, which is the difference
          # between "SEO 0.92" and something a person can go and fix.
          python3 scripts/lighthouse_failing_audits.py .lighthouseci
          exit 1

      # `include-hidden-files` is required, and its absence is why every failed
      # run so far uploaded nothing. Since upload-artifact v4.4 a dot-prefixed
      # path is excluded by default, and `.lighthouseci` is dot-prefixed — so
      # the step reported "No files were found with the provided path" for a
      # directory that was there the whole time. `backend-coverage` above never
      # hit this because its path is not hidden, which is exactly what made the
      # symptom look like a Lighthouse problem rather than an upload one.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-report
          path: |
            .lighthouseci
            lhci-assert.log
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - module-boundaries
      - backend-test
      - openapi-contract
      - frontend
      - lighthouse
      - security
    if: always()
    steps:
      # A single required status check for branch protection. Evaluated as a
      # GitHub expression rather than a shell string, because the job results
      # would otherwise need interpolating into a quoted command.
      - name: Verify every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs did not succeed."
          exit 1
